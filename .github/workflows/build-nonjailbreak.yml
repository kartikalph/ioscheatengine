name: Build Non-Jailbreak App

on:
  push:
    branches: [ main ]
    paths:
      - 'NonJailbreak/**'
      - 'KittyMemory/**'
      - 'CustomView/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        brew install perl openssl ldid
    
    - name: Clone Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
    
    - name: Build app
      env:
        THEOS: ~/theos
      run: |
        export PATH=$PATH:~/theos/bin
        make APPLICATION_NAME=CheatEngine
    
    - name: Package as IPA
      run: |
        ls -la .theos/obj/
        # List all outputs
        find . -name "*.app" -o -name "*.ipa"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cheat-engine-app
        path: |
          .theos/obj/
          *.ipa
          *.app
        retention-days: 30
    
    - name: Show build output
      run: |
        echo "=== Build Complete ==="
        ls -la .theos/obj/ || echo "No obj directory"
        echo "=== Artifacts created ==="
