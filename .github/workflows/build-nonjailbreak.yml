name: Build Non-Jailbreak App (iOS App)

on:
  push:
    branches: [ main ]
    paths:
      - 'NonJailbreak/**'
      - 'KittyMemory/**'
      - 'CustomView/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create iOS App Project
      run: |
        # Create app bundle structure
        mkdir -p CheatEngine.app
        
        # Compile Objective-C code
        clang -c \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=12.0 \
          -fno-objc-arc \
          -fobjc-runtime=ios-12.0 \
          NonJailbreak/AppDelegate.mm \
          -o AppDelegate.o
        
        # Link the binary
        ld \
          -arch arm64 \
          -lSystem \
          -lc++ \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -o CheatEngine.app/CheatEngine \
          AppDelegate.o \
          -undefined dynamic_lookup
        
        # Copy Info.plist
        cp NonJailbreak/Info.plist CheatEngine.app/Info.plist
        
        # Create PkgInfo
        echo "APPL????" > CheatEngine.app/PkgInfo
    
    - name: Create IPA Package
      run: |
        # Create IPA structure
        mkdir -p Payload
        cp -r CheatEngine.app Payload/
        
        # Create IPA (just a zip)
        cd Payload
        zip -r ../CheatEngine.ipa .
        cd ..
        
        # Verify IPA
        ls -lh CheatEngine.ipa
        unzip -l CheatEngine.ipa | head -20
    
    - name: Upload iOS App IPA
      uses: actions/upload-artifact@v4
      with:
        name: CheatEngine-NonJailbreak
        path: CheatEngine.ipa
        retention-days: 30
    
    - name: Success Summary
      run: |
        echo "✅ CheatEngine.ipa created successfully!"
        echo "📦 File size: $(ls -lh CheatEngine.ipa | awk '{print $5}')"
        echo "📱 Install with: SignKill or TrollStore"
        echo "🎯 Works on: Any iOS device (no jailbreak needed!)"
