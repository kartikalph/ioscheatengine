name: Build Non-Jailbreak App (iOS App)

on:
  push:
    branches: [ main ]
    paths:
      - 'NonJailbreak/**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create Simple IPA
      run: |
        # Create app bundle
        mkdir -p CheatEngine.app
        
        # Compile the Objective-C app (minimal, no Theos)
        xcrun clang \
          -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=12.0 \
          -c NonJailbreak/AppDelegate.mm \
          -o /tmp/app.o \
          -fno-objc-arc \
          -framework UIKit \
          -framework Foundation
        
        # Link it
        xcrun ld \
          -arch arm64 \
          -dylib \
          -o CheatEngine.app/CheatEngine \
          /tmp/app.o \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -lSystem -lc++ \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics \
          -undefined dynamic_lookup
        
        # Copy resources
        cp NonJailbreak/Info.plist CheatEngine.app/
        echo "APPL????" > CheatEngine.app/PkgInfo
        
        # Verify
        ls -la CheatEngine.app/
    
    - name: Package into IPA
      run: |
        # Create proper IPA structure
        rm -rf Payload
        mkdir -p Payload
        mv CheatEngine.app Payload/
        
        # Create IPA as zip
        zip -r CheatEngine.ipa Payload/ -q
        
        # Show results
        ls -lh CheatEngine.ipa
        echo "✅ IPA created successfully"
        unzip -l CheatEngine.ipa | head -15
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CheatEngine.ipa
        path: CheatEngine.ipa
        retention-days: 30
