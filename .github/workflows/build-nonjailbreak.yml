name: Build Non-Jailbreak App (iOS App)

on:
  push:
    branches: [ main ]
    paths:
      - 'NonJailbreak/**'
      - 'KittyMemory/**'
      - 'CustomView/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create Xcode Project
      run: |
        mkdir -p CheatEngineApp
        cd CheatEngineApp
        cat > buildApp.sh << 'EOF'
        #!/bin/bash
        
        # Create proper iOS App Bundle structure
        APP_DIR="CheatEngine.app"
        mkdir -p "$APP_DIR"
        
        # Copy and compile source files
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=12.0 \
          -fno-objc-arc \
          ../NonJailbreak/AppDelegate.mm \
          -o "$APP_DIR/CheatEngine" \
          -framework UIKit \
          -framework Foundation \
          -framework CoreGraphics
        
        # Copy resources
        cp ../NonJailbreak/Info.plist "$APP_DIR/Info.plist"
        
        # Create IPA structure
        mkdir -p Payload
        mv "$APP_DIR" Payload/
        
        # Create IPA
        zip -r CheatEngine.ipa Payload/
        
        # Validate
        ls -lh CheatEngine.ipa
        EOF
        
        chmod +x buildApp.sh
        ./buildApp.sh
    
    - name: Sign app
      run: |
        cd CheatEngineApp
        echo "App bundle created: CheatEngine.ipa"
        file CheatEngine.ipa
        unzip -l CheatEngine.ipa | head -20
    
    - name: Upload iOS App
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-ipa
        path: CheatEngineApp/CheatEngine.ipa
        retention-days: 30
    
    - name: Create Release Summary
      run: |
        echo "✅ Non-Jailbreak iOS App Built Successfully!"
        echo ""
        echo "📱 Installation:"
        echo "1. Download CheatEngine.ipa"
        echo "2. Install with SignKill or TrollStore"
        echo "3. Works on ANY iOS device (no jailbreak needed!)"
